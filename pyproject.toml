[project]
name = "ml-base"
version = "0.1.0"
description = "Base ML environment for GPU projects with PyTorch CUDA 12.6"
requires-python = "==3.12.*"
dependencies = [
    "torch==2.9.1",
    "torchaudio==2.9.1",
    "torchcodec==0.8.1",
    "accelerate>=0.26.0",
    "librosa>=0.11.0",
    "soundfile>=0.13.1",
    "tqdm>=4.66.5",
    "pandas>=3.0.2",
    "wandb>=0.26.1",
    "gradio>=6.15.2",
]

# development only dependencies notebooks and etc...
[project.optional-dependencies]
dev = [
    "ipykernel",
    "matplotlib"
]

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu126"

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"

[dependency-groups]
dev = [
    "pandas>=3.0.2",
    "wget>=3.2",
]
