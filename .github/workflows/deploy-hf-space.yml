name: Deploy Hugging Face Space

on:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "configs/**"
      - "src/**"
      - "models/checkpoints/**"
      - "pyproject.toml"
      - ".github/workflows/deploy-hf-space.yml"
      - "data/**"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout source repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v3
        with:
          version: latest

      - name: Regenerate Hugging Face requirements from uv lock
        run: uv pip compile pyproject.toml -o app/requirements.txt

      - name: Normalize requitements for hugging Face Space
        run: |
          set -euo pipefail
          # Remove CUDA specific pacakges and sufixxes
          sed -i \
            -e '/^nvidia-/d' \
            -e 's/+cu[0-9]\{2,\}//g' \
            -e '/^pydantic==/d' \
            -e '/^pydantic-core==/d' \
            -e '/^requests==/d' \
            app/requirements.txt
          echo "=== Normalized requirements.txt ==="
          cat app/requirements.txt

      - name: Prepare deployment bundle
        run: |
          set -euo pipefail
          rm -rf /tmp/hf-space-bundle
          mkdir -p /tmp/hf-space-bundle/models/checkpoints
          mkdir -p /tmp/hf-space-bundle/data

          cp app/app.py /tmp/hf-space-bundle/app.py
          cp app/api.py /tmp/hf-space-bundle/api.py
          cp app/inference.py /tmp/hf-space-bundle/inference.py
          cp app/requirements.txt /tmp/hf-space-bundle/requirements.txt
          cp app/README.md /tmp/hf-space-bundle/README.md
          cp -r configs /tmp/hf-space-bundle/configs
          cp -r src /tmp/hf-space-bundle/src
          cp models/checkpoints/best_sed_model.pth /tmp/hf-space-bundle/models/checkpoints/best_sed_model.pth
          cp data/processed/URBAN-SED_v2.0.0/scaler.pt /tmp/hf-space-bundle/data/scaler.pt

      - name: Clone Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_REPO: ${{ secrets.HF_SPACE_REPO }}
        run: |
          set -euo pipefail
          git clone "https://user:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE_REPO}" /tmp/hf-space-repo

      - name: Push deployment bundle to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_REPO: ${{ secrets.HF_SPACE_REPO }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y git-lfs

          cd /tmp/hf-space-repo

          git lfs install
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Copy files
          rsync -a --delete --exclude='.git' /tmp/hf-space-bundle/ ./

          # Manually create LFS object and pointer for .pth file
          PTH_FILE="models/checkpoints/best_sed_model.pth"
          PTH_OID=$(sha256sum "$PTH_FILE" | cut -d' ' -f1)
          PTH_SIZE=$(stat --format=%s "$PTH_FILE")

          # Store the file in LFS objects directory
          LFS_OBJECT_DIR=".git/lfs/objects/${PTH_OID:0:2}/${PTH_OID:2:2}"
          mkdir -p "$LFS_OBJECT_DIR"
          cp "$PTH_FILE" "$LFS_OBJECT_DIR/$PTH_OID"

          # Create LFS pointer using git lfs pointer (computes correct SHA256)
          git lfs pointer --file="$PTH_FILE" > "$PTH_FILE"

          # Manually create LFS object and pointer for .pt scaler
          PT_FILE="data/scaler.pt"
          PT_OID=$(sha256sum "$PT_FILE" | cut -d' ' -f1)
          PT_SIZE=$(stat --format=%s "$PT_FILE")

          # Store the file in LFS objects directory
          LFS_OBJECT_DIR=".git/lfs/objects/${PT_OID:0:2}/${PT_OID:2:2}"
          mkdir -p "$LFS_OBJECT_DIR"
          cp "$PT_FILE" "$LFS_OBJECT_DIR/$PT_OID"

          # Create LFS pointer using git lfs pointer (computes correct SHA256)
          git lfs pointer --file="$PT_FILE" > "$PT_FILE"

          # Add everything
          git add .
          git commit -m 'Deploy'

          # Push LFS objects first, then refs
          git lfs push origin --all
          git push --force "https://user:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE_REPO}" main